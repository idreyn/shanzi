[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shanzi"
version = "0.1.0"
description = "Recursive Hanzi component embeddings and semantic trajectory remixing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
shanzi = "shanzi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shanzi*"]
